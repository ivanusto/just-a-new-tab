name: Update AMO Listing Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Upload icon, screenshots & listing fields to AMO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload metadata to AMO
        run: node scripts/amo-metadata.js
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
